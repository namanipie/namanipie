name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: namanipie
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23000000&color_dots=%23FFFFFF,%23EEEEEE,%23CCCCCC,%23888888,%23000000
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2367E8F9

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
